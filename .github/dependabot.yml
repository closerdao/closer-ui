version: 2
updates:
  # pnpm uses the npm ecosystem; the root lockfile covers the workspace.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    # Allow releases to clear pnpm's default one-day minimum release age.
    cooldown:
      default-days: 2
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
      # One PR listing every breaking upgrade; land each on its own branch.
      major:
        update-types: ['major']
      security:
        applies-to: 'security-updates'
        patterns: ['*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    groups:
      actions:
        patterns: ['*']
