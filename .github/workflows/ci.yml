name: CI

on:
  push:
    branches: ['main', 'develop', 'main2', 'develop2']
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turbo remote cache: a task whose inputs are unchanged since any earlier run
# (on any branch) is replayed instead of executed.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  checks:
    name: Prettier + lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Guard against stray lockfiles
        run: |
          if git ls-files | grep -E '(^|/)(yarn\.lock|package-lock\.json)$'; then
            echo "Found a yarn/npm lockfile; this repo is pnpm-only." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - run: pnpm prettier --check .
      - run: pnpm turbo run lint

  test:
    name: Test (${{ matrix.package }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every workspace package with a jest suite.
        package: [closer, tdf, village-app]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run test --filter=${{ matrix.package }} -- --ci
