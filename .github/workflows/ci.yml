name: CI

on:
  push:
    branches: ['main', 'develop', 'main2', 'develop2']
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  prettier:
    name: Prettier
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Guard against stray lockfiles
        run: |
          if git ls-files | grep -E '(^|/)(yarn\.lock|package-lock\.json)$'; then
            echo "Found a yarn/npm lockfile; this repo is pnpm-only." >&2
            exit 1
          fi

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Prettier
        run: pnpm prettier --check .

  lint:
    name: Lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          turbo-cache-scope: lint

      - name: Lint
        run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    # Placeholder: no root "typecheck" script exists yet. Issue 921 (Cypress
    # removal) is expected to add one; this job flips to required (drop
    # continue-on-error) once it lands. `--if-present` makes the job a
    # clean no-op until then.
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm run --if-present typecheck

  test:
    name: Test (${{ matrix.name }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: closer 1/2
            filter: closer
            shard: '1/2'
          - name: closer 2/2
            filter: closer
            shard: '2/2'
          - name: tdf
            filter: tdf
            shard: ''
          - name: village-app
            filter: village-app
            shard: ''
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Test
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter ${{ matrix.filter }} test --ci --shard=${{ matrix.shard }}
          else
            pnpm --filter ${{ matrix.filter }} test --ci
          fi
