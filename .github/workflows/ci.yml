name: CI

on:
  push:
    branches: ['main', 'develop', 'main2', 'develop2']
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          # Full history so turbo can diff against TURBO_SCM_BASE.
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prettier
        run: yarn prettier --check .

      # --affected defaults its base to `main`; point it at what this run is
      # actually changing. On a new-branch push `before` is all zeros, so fall
      # back to origin/develop.
      - name: Set affected base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="origin/develop"
          fi
          echo "TURBO_SCM_BASE=$base" >> "$GITHUB_ENV"

      - name: Test
        run: yarn test -- --affected
